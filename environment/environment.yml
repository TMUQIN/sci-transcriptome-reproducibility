# Advisory reconstruction environment for the inferential SCI Reason pipeline.
# The frozen result-generation environment used Python 3.14.2. Python 3.11 is
# provided here as a compatibility reconstruction environment only.
# Create: conda env create -f environment.yml && conda activate sci-reason
name: sci-reason
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.26,<2.3
  - pandas>=2.1,<3
  - polars=1.41.2
  - scipy>=1.11,<1.16
  - scikit-learn>=1.4,<1.8
  - requests>=2.31
  - anndata>=0.10,<0.13
  - scanpy>=1.10,<1.13
  - leidenalg
  - python-igraph
  - scikit-misc
  - h5py
  - matplotlib=3.10.8
  - r-base=4.4
  - r-matrix
  - bioconductor-edger
  - bioconductor-limma
  - pip
  - pip:
      - scrublet

# Optional modules are intentionally not part of the core lock:
# - spatial/communication: squidpy, liana, decoupler
# - differential abundance: pertpy/scCODA or MiloR
# - multiome GRN: ArchR/Signac/SCENIC+ in a separately validated environment
# - CellOracle: separate Python environment; do not mix with the core Scanpy lock
# - LINCS: remote LDP3 API or a separately versioned local signature environment
